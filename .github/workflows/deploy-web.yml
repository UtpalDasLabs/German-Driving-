name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main, claude/festive-einstein-7wwhh6]
  workflow_dispatch:

# Allow the workflow to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and check the study data
        run: npm run data

      - name: Type check
        run: npm run typecheck

      - name: Build static web bundle
        run: npm run build:web

      - name: Add SPA fallback and disable Jekyll
        run: |
          # GitHub Pages serves 404.html for unknown paths; expo's static export
          # already emits a page per route, so this only covers deep links that
          # arrive before the client router boots.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      # Requires the Pages site to already exist: Settings -> Pages -> Source:
      # GitHub Actions. The default GITHUB_TOKEN is not allowed to create one.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
